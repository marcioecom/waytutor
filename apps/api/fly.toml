app = "waytutor"
primary_region = "gru"
kill_timeout = "130s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/migrate"

[env]
  ENV = "production"
  ADDR = ":8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  interval = "30s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
