services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: waytutor
      POSTGRES_PASSWORD: waytutor
      POSTGRES_DB: waytutor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waytutor -d waytutor"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: apps/api
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgres://waytutor:waytutor@db:5432/waytutor?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: apps/api
    environment:
      ENV: development
      DATABASE_URL: postgres://waytutor:waytutor@db:5432/waytutor?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
